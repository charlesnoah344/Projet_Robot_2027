; Projet PlatformIO du PAMI.
;
; « pio run » et « pio run -t upload » ne concernent QUE le firmware (esp32dev).
; Sans cette ligne, « upload » téléverserait tous les environnements l'un après l'autre,
; et un banc de test sans évitement pourrait rester dans le PAMI.
[platformio]
default_envs = esp32dev

; Réglages communs à tous les programmes qui tournent sur l'ESP32.
[esp32_common]
; Version figée : toute l'équipe compile avec le même core Arduino (2.0.17 -> API LEDC 2.x).
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
; Avertissements supplémentaires, seulement sur notre code (pas sur le framework).
build_src_flags = -Wall -Wextra

; Firmware du PAMI : le seul programme à mettre dans le PAMI pour jouer.
[env:esp32dev]
extends = esp32_common
; Les tests de la logique se lancent avec -e native ou -e logic_esp32, pas ici.
test_ignore = *

; Tests de la logique pure (src/logic/) sur PC : pio test -e native
; Nécessite un compilateur g++ sur le PC (MinGW-w64 sous Windows).
[env:native]
platform = native
build_src_filter = -<*> +<logic/>
test_build_src = yes

; Les mêmes tests, exécutés sur l'ESP32 branché en USB : pio test -e logic_esp32
; Utile quand g++ n'est pas installé sur le PC.
[env:logic_esp32]
extends = esp32_common
build_src_filter = -<*> +<logic/>
test_build_src = yes

; ---------------------------------------------------------------------------
; Bancs de test : un programme par composant (skill banc-de-test).
; Ils peuvent ne pas avoir d'évitement : ne jamais les laisser dans le PAMI.
; Après un banc de test : pio run -t upload (remet le firmware).
; ---------------------------------------------------------------------------

; Étape 2 : moteurs et driver MDD3A. pio run -e test_moteurs -t upload
[env:test_moteurs]
extends = esp32_common
build_src_filter = -<*> +<motor_driver.cpp> +<../test_bench/moteurs/>
test_ignore = *
