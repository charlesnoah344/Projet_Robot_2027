; Projet PlatformIO du PAMI.
;
; « pio run » et « pio run -t upload » ne concernent QUE le firmware (esp32dev).
; Sans cette ligne, « upload » téléverserait tous les environnements l'un après l'autre,
; et un banc de test sans évitement pourrait rester dans le PAMI.
[platformio]
default_envs = esp32dev

; Réglages communs à tous les programmes qui tournent sur l'ESP32.
[esp32_common]
; Version figée : toute l'équipe compile avec le même core Arduino (2.0.17 -> API LEDC 2.x).
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
; Avertissements supplémentaires, seulement sur notre code (pas sur le framework).
build_src_flags = -Wall -Wextra

; Console + Wi-Fi (D010), à mettre dans TOUS les programmes de l'ESP32 : un programme sans Wi-Fi,
; une fois téléversé, couperait la liaison sans fil, et il faudrait revenir à l'USB.
[wireless]
src = +<console.cpp> +<wireless.cpp>

; Firmware du PAMI : le seul programme à mettre dans le PAMI pour jouer.
[env:esp32dev]
extends = esp32_common
; Les tests de la logique se lancent avec -e native ou -e logic_esp32, pas ici.
test_ignore = *

; Tests de la logique pure (src/logic/) sur PC : pio test -e native
; Nécessite un compilateur g++ sur le PC (MinGW-w64 sous Windows).
[env:native]
platform = native
build_src_filter = -<*> +<logic/>
test_build_src = yes

; Les mêmes tests, exécutés sur l'ESP32 branché en USB : pio test -e logic_esp32
; Utile quand g++ n'est pas installé sur le PC.
[env:logic_esp32]
extends = esp32_common
build_src_filter = -<*> +<logic/>
test_build_src = yes

; ---------------------------------------------------------------------------
; Bancs de test : un programme par composant (skill banc-de-test).
; Ils peuvent ne pas avoir d'évitement : ne jamais les laisser dans le PAMI.
; Après un banc de test : pio run -t upload (remet le firmware).
; ---------------------------------------------------------------------------

; Étape 2 : moteurs et driver MDD3A. pio run -e test_moteurs -t upload
[env:test_moteurs]
extends = esp32_common
build_src_filter = -<*> +<motor_driver.cpp> ${wireless.src} +<../test_bench/moteurs/>
test_ignore = *

; Odométrie : ligne droite, rotation, carré, SANS ultrason. pio run -e test_odometrie -t upload
; Utilise le vrai code de déplacement du match (motion, mission, logic/), sans safety.
[env:test_odometrie]
extends = esp32_common
build_src_filter = -<*> +<motor_driver.cpp> +<encoders.cpp> +<motion.cpp> +<mission.cpp> +<sensors.cpp> +<logic/> ${wireless.src} +<../test_bench/odometrie/>
test_ignore = *

; Ultrason HC-SR04 : chaque mesure brute et filtrée, moteurs freinés. pio run -e test_ultrason -t upload
[env:test_ultrason]
extends = esp32_common
build_src_filter = -<*> +<motor_driver.cpp> +<sensors.cpp> +<logic/> ${wireless.src} +<../test_bench/ultrason/>
test_ignore = *

; ---------------------------------------------------------------------------
; Les mêmes programmes, téléversés et lus SANS CÂBLE (D010).
; - PC connecté au réseau du PAMI (nom et mot de passe : src/wifi_secrets.h).
; - Le tout premier téléversement d'un programme avec Wi-Fi se fait par USB.
; - Téléverser : pio run -e esp32dev_wifi -t upload   (pas de bouton BOOT)
; - Moniteur   : pio device monitor -e esp32dev_wifi
; - Téléversement accepté seulement PAMI immobile (avant le départ, après la fin, hors essai).
; ---------------------------------------------------------------------------
[wifi_upload]
upload_protocol = espota
upload_port = 192.168.4.1
; Le PAMI rappelle le PC sur ce port pour télécharger le programme. Port fixe : une seule règle
; de pare-feu Windows suffit (docs/guide-pratique-pami.md, « Sans câble »).
upload_flags = --host_port=55910
monitor_port = socket://192.168.4.1:23

[env:esp32dev_wifi]
extends = env:esp32dev, wifi_upload

[env:test_moteurs_wifi]
extends = env:test_moteurs, wifi_upload

[env:test_odometrie_wifi]
extends = env:test_odometrie, wifi_upload

[env:test_ultrason_wifi]
extends = env:test_ultrason, wifi_upload
